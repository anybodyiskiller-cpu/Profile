mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.xboxlive.com"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
proxy-providers:
  Airport:
    type: http
    url: "https://example.invalid/redacted"
    path: ./providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: http://www.google.com/generate_204
      interval: 300
    benchmark-url: http://www.google.com/generate_204
